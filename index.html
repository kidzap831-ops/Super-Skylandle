<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skylandle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>SKYLANDLE</h1>
      <p>Guess the mystery Skylander!</p>
    </header>

    <section class="account-card">
      <div id="loggedOutView">
        <h2>Account</h2>
        <p class="muted">Log in to save your total score between visits.</p>

        <div class="account-grid">
          <input id="usernameInput" type="text" maxlength="24" placeholder="Username" autocomplete="username">
          <input id="emailInput" type="email" placeholder="Email" autocomplete="email">
          <input id="passwordInput" type="password" minlength="8" placeholder="Password (8+ characters)" autocomplete="current-password">
        </div>

        <div class="account-buttons">
          <button id="signUpButton" type="button">Create Account</button>
          <button id="loginButton" type="button">Log In</button>
        </div>
      </div>

      <div id="loggedInView" class="hidden">
        <div class="logged-in-row">
          <div>
            <div class="muted">Logged in as</div>
            <strong id="accountUsername">Player</strong>
          </div>
          <button id="logoutButton" type="button" class="secondary">Log Out</button>
        </div>
      </div>

      <p id="authMessage" class="auth-message" aria-live="polite"></p>
    </section>

    <section class="scoreboard">
      <div><span class="score-label">Current score</span><strong id="score">100</strong></div>
      <div><span class="score-label">Guesses</span><strong id="guessCount">0</strong></div>
      <div><span class="score-label">Total score</span><strong id="totalScore">0</strong></div>
    </section>

    <section class="game-card">
      <div class="guess-area">
        <div class="autocomplete-wrap">
          <input id="guessInput" type="text" placeholder="Type a Skylander..." autocomplete="off">
          <div id="autocomplete" class="autocomplete"></div>
        </div>
        <button id="guessButton" type="button">Guess</button>
        <button id="newGameButton" type="button" class="secondary">New Game</button>
      </div>

      <div id="winMessage" class="win-message" aria-live="polite"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Skylander</th>
              <th>Element</th>
              <th>Game</th>
              <th>Attack Form</th>
              <th>Color</th>
              <th>Health</th>
              <th>Speed</th>
              <th>Armor</th>
            </tr>
          </thead>
          <tbody id="guessTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
