<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skylandle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

```
<h1>Skylandle</h1>
<p class="subtitle">Guess the mystery Skylander!</p>

<!-- SCORE SYSTEM -->
<div class="score-board">
  <div class="score-box">
    <span class="score-label">Score</span>
    <span id="score">100</span>
  </div>

  <div class="score-box">
    <span class="score-label">Guesses</span>
    <span id="guessCount">0</span>
  </div>
</div>

<div class="game-controls">
  <input
    type="text"
    id="guessInput"
    placeholder="Enter a Skylander..."
    autocomplete="off"
  >
  <button id="guessButton">Guess</button>
  <button id="newGameButton">New Game</button>
</div>

<div id="autocomplete" class="autocomplete"></div>

<div id="winMessage" class="win-message"></div>

<div class="table-wrapper">
  <table id="guessTable">
    <thead>
      <tr>
        <th>Skylander</th>
        <th>Element</th>
        <th>Game</th>
        <th>Attack Form</th>
        <th>Color</th>
        <th>Health</th>
        <th>Speed</th>
        <th>Armor</th>
      </tr>
    </thead>

    <tbody id="guessTableBody"></tbody>
  </table>
</div>

<div class="legend">
  <div>
    <span class="legend-box green"></span>
    Correct
  </div>

  <div>
    <span class="legend-box yellow"></span>
    Close / Related
  </div>

  <div>
    <span class="legend-box gray"></span>
    Incorrect
  </div>

  <div>
    <span>↑</span>
    Too low
  </div>

  <div>
    <span>↓</span>
    Too high
  </div>
</div>
```

  </div>

  <script src="script.js"></script>

</body>
</html>
